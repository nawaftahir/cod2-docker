services:
  cod2:
    build:
      context: .
      target: runtime
      # The baked libcod follows .env too: docker compose build compiles
      # LIBCOD_REPO @ LIBCOD_REF with LIBCOD_BUILD_ARGS
      args:
        LIBCOD_REPO: ${LIBCOD_REPO:-https://github.com/ibuddieat/zk_libcod}
        LIBCOD_REF: ${LIBCOD_REF:-master}
        LIBCOD_BUILD_ARGS: ${LIBCOD_BUILD_ARGS:-mysql1}
    image: cod2-server:latest
    container_name: cod2
    restart: unless-stopped
    # live server console: docker attach cod2  (detach: CTRL-P then CTRL-Q;
    # CTRL-C would kill the server). Read-only logs: docker compose logs -f
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false

    # --- Networking (pick ONE) ---------------------------------------
    # host mode (default): real client IPs, no NAT, port = NET_PORT
    network_mode: host
    # bridged mode: comment network_mode above, uncomment ports below,
    # keep host port in sync with the net_port actually in use (.env or .cfg).
    # Add one line per extra instance / proxy / relay port.
    # See docs/configuration.md "Networking".
    # ports:
    #   - "28960:28960/udp"     # game (net_port)
    #   - "28970:28970/udp"     # example: second instance
    #   - "29000:29000/udp"     # example: UDP proxy / relay sidecar

    volumes:
      # game data: main/ paks, mods, configs
      - ./game:/server/game
      # optional hot-swap libcod: drop libcod2.so here + restart
      - ./libcod:/server/libcod/custom

  # On-demand libcod builder (never starts with the server):
  #   docker compose --profile tools run --rm libcod-builder mysql2 debug
  #   or: ./scripts/build-libcod.sh --repo URL --ref BRANCH --args "mysql2 debug"
  libcod-builder:
    build:
      context: .
      target: libcod-builder
    image: cod2-server:libcod-builder
    profiles: [tools]
    env_file:
      - path: .env
        required: false
    environment:
      LIBCOD_REPO: ${LIBCOD_REPO:-https://github.com/ibuddieat/zk_libcod}
      LIBCOD_REF: ${LIBCOD_REF:-master}
      LIBCOD_BUILD_ARGS: ${LIBCOD_BUILD_ARGS:-mysql1}
    volumes:
      - ./libcod:/out
