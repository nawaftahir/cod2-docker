name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ["debian:13-slim", "ubuntu:24.04"]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: cod2-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - vanilla dry run
        run: |
          docker run --rm -e ENTRYPOINT_DRYRUN=1 -e LIBCOD_MODE=off cod2-server:ci

      - name: Smoke test - baked libcod dry run
        run: |
          docker run --rm -e ENTRYPOINT_DRYRUN=1 cod2-server:ci | tee out.log
          grep -q "libcod2.so.default" out.log

      - name: Smoke test - cvars + variant + raw params
        run: |
          docker run --rm -e ENTRYPOINT_DRYRUN=1 \
            -e COD2_VARIANT=nodelay_va_loc \
            -e COD2_SET_sv_punkbuster=0 -e PARAMS="+map mp_toujane" \
            cod2-server:ci | tee out.log
          grep -q "cod2_lnxded_1_3_nodelay_va_loc" out.log
          grep -q -- "+set sv_punkbuster 0" out.log
          grep -q -- "+map mp_toujane" out.log

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && matrix.base == 'debian:13-slim'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push runtime image
        if: startsWith(github.ref, 'refs/tags/v') && matrix.base == 'debian:13-slim'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha

      - name: Push libcod-builder image
        if: startsWith(github.ref, 'refs/tags/v') && matrix.base == 'debian:13-slim'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: libcod-builder
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:libcod-builder
            ghcr.io/${{ github.repository }}:libcod-builder-${{ github.ref_name }}
          cache-from: type=gha
